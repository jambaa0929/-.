<style>
  :root {
    --bg: #17110e;
    --bg-2: #211813;
    --ivory: #f6efe1;
    --ivory-dim: #cfc4ae;
    --muted: #a39782;
    --gold: #d4b06a;
    --gold-2: #f1d99c;
    --gold-deep: #9c7a38;
    --red: #b3283a;
    --red-deep: #6e1a26;
    --sky: #8fb8e6;
    --card: rgba(246, 239, 225, .045);
    --line: rgba(212, 176, 106, .28);
    --serif: "Cormorant Garamond", "Noto Serif", Georgia, "Times New Roman", serif;
    --caps: "Cormorant SC", "Cormorant Garamond", Georgia, serif;
    --ease: cubic-bezier(.22, .7, .2, 1);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0; min-height: 100vh;
    font-family: var(--serif); font-size: 20px; line-height: 1.5; color: var(--ivory);
    background-color: var(--bg);
    background-image:
      radial-gradient(90% 50% at 50% 0%, rgba(179, 40, 58, .16), transparent 70%),
      radial-gradient(70% 40% at 50% 100%, rgba(212, 176, 106, .08), transparent 70%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  body.locked { overflow: hidden; }
  img { max-width: 100%; display: block; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  /* gold dust */
  #dust { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

  .page { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 0 20px calc(40px + env(safe-area-inset-bottom, 0px)); }

  /* ---------- shared ornaments ---------- */
  .gold-text {
    background: linear-gradient(180deg, var(--gold-2) 0%, var(--gold) 45%, var(--gold-deep) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .ulzii { display: block; margin: 0 auto; color: var(--gold); }
  .hero-knot .ulzii { filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .55)) drop-shadow(0 0 22px rgba(226, 176, 106, .18)); }
  .hee {
    height: 26px; width: 100%; margin: 0 auto; opacity: .85;
    background: var(--hee) repeat-x center / auto 26px;
  }
  .divider { display: flex; align-items: center; gap: 14px; justify-content: center; margin: 26px 0; color: var(--gold); }
  .divider::before, .divider::after { content: ""; flex: 1; max-width: 90px; height: 1px; background: linear-gradient(90deg, transparent, var(--line)); }
  .divider::after { transform: scaleX(-1); }

  .reveal { opacity: 0; transform: translateY(18px); transition: opacity 1s var(--ease), transform 1s var(--ease); }
  .reveal.in { opacity: 1; transform: none; }

  section { text-align: center; padding: 56px 0 8px; }
  .eyebrow { margin: 0; font-family: var(--caps); font-weight: 500; font-size: 15px; letter-spacing: .32em; text-transform: uppercase; color: var(--gold); }
  h2.title { margin: 10px 0 0; font-weight: 600; font-size: clamp(34px, 9.5vw, 44px); line-height: 1.1; }

  /* ---------- hero ---------- */
  .hero { padding-top: calc(48px + env(safe-area-inset-top, 0px)); }
  .hero .kicker { margin: 18px 0 0; font-style: italic; font-size: 22px; color: var(--ivory-dim); }
  .names { margin: 10px 0 0; font-weight: 600; font-size: clamp(46px, 13.5vw, 68px); line-height: 1.02; letter-spacing: .005em; }
  .names .amp { display: block; margin: 4px 0; font-style: italic; font-weight: 400; font-size: .62em; line-height: 1; }
  .date-line { margin: 22px 0 0; display: inline-flex; align-items: center; gap: 14px; font-family: var(--caps); font-size: 19px; letter-spacing: .14em; color: var(--ivory); }
  .date-line b { font-family: var(--serif); font-weight: 600; font-size: 46px; letter-spacing: 0; line-height: 1; padding: 0 16px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  .date-line span { display: flex; flex-direction: column; line-height: 1.25; }
  .date-sub { margin: 10px 0 0; font-style: italic; font-size: 19px; color: var(--muted); }

  .arch {
    position: relative; margin: 38px auto 0; width: min(100%, 420px);
    padding: 10px; border-radius: 240px 240px 18px 18px;
    background: linear-gradient(160deg, var(--gold-2), var(--gold-deep) 55%, var(--gold) 100%);
    box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .7), 0 0 0 1px rgba(0, 0, 0, .4);
  }
  .arch::before {
    content: ""; position: absolute; inset: 4px; border-radius: 236px 236px 15px 15px;
    border: 1px solid rgba(23, 17, 14, .5); pointer-events: none; z-index: 2;
  }
  .arch-in { position: relative; overflow: hidden; border-radius: 230px 230px 10px 10px; aspect-ratio: 2 / 3; background: #2a201a; }
  .arch-in img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; transform: scale(1.06); transition: transform 2.4s var(--ease); }
  .revealed .arch-in img { transform: scale(1); }
  .arch-in::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 70%, rgba(23, 17, 14, .45)); }
  .arch .corner { position: absolute; bottom: -18px; width: 54px; height: 54px; color: var(--gold); z-index: 3; }
  .arch .corner.l { left: -18px; } .arch .corner.r { right: -18px; transform: scaleX(-1); }

  .scroll-cue { margin: 30px auto 0; display: flex; flex-direction: column; align-items: center; gap: 6px; font-style: italic; font-size: 16px; color: var(--muted); }
  .scroll-cue i { width: 1px; height: 34px; background: linear-gradient(var(--gold), transparent); animation: cue 2.2s ease-in-out infinite; transform-origin: top; }
  @keyframes cue { 0% { transform: scaleY(0); opacity: 1; } 70% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 0; } }

  /* ---------- letter ---------- */
  .letter p { margin: 0 auto; max-width: 420px; font-size: 22px; line-height: 1.6; color: var(--ivory-dim); }
  .letter .dear { margin-bottom: 14px; font-style: italic; font-size: 26px; color: var(--ivory); }
  .letter .dear:empty { display: none; }

  /* ---------- countdown ---------- */
  .count { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 24px auto 0; max-width: 420px; }
  .count div { padding: 16px 4px 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
  .count b { display: block; font-weight: 600; font-size: clamp(30px, 9vw, 40px); line-height: 1; font-variant-numeric: tabular-nums; }
  .count small { display: block; margin-top: 6px; font-family: var(--caps); font-size: 12px; letter-spacing: .16em; color: var(--muted); }
  .count-done { margin: 20px 0 0; font-style: italic; font-size: 24px; color: var(--gold); }

  /* ---------- event cards ---------- */
  .event {
    position: relative; margin-top: 24px; padding: 34px 24px 28px; border-radius: 22px;
    border: 1px solid var(--line); background: linear-gradient(180deg, rgba(246, 239, 225, .06), rgba(246, 239, 225, .02));
  }
  .event::before {
    content: ""; position: absolute; inset: 6px; border-radius: 17px; border: 1px solid rgba(212, 176, 106, .12); pointer-events: none;
  }
  .event .venue { margin: 8px 0 0; font-weight: 600; font-size: clamp(30px, 8.5vw, 38px); line-height: 1.1; }
  .event .time { margin: 18px 0 0; font-weight: 600; font-size: 54px; line-height: 1; }
  .event .tlabel { margin: 6px 0 0; font-style: italic; font-size: 19px; color: var(--muted); }
  .addr { display: inline-flex; align-items: center; gap: 8px; margin: 16px 0 0; font-size: 19px; color: var(--ivory-dim); }
  .addr svg { flex: none; color: var(--red); }

  .tl { list-style: none; margin: 22px auto 0; padding: 0; max-width: 300px; text-align: left; position: relative; }
  .tl::before { content: ""; position: absolute; left: 70px; top: 14px; bottom: 14px; width: 1px; background: var(--line); }
  .tl li { position: relative; display: grid; grid-template-columns: 58px 1fr; gap: 26px; align-items: baseline; padding: 8px 0; }
  .tl li::before { content: ""; position: absolute; left: 67px; top: 50%; width: 7px; height: 7px; background: var(--gold); transform: translateY(-50%) rotate(45deg); }
  .tl time { font-weight: 600; font-size: 23px; text-align: right; font-variant-numeric: tabular-nums; }
  .tl span { font-size: 21px; color: var(--ivory-dim); }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    padding: 13px 24px; min-height: 50px; font: 600 19px var(--serif); text-decoration: none; letter-spacing: .02em;
    color: var(--bg); background: linear-gradient(180deg, var(--gold-2), var(--gold) 60%, #b8924c);
    border: 0; border-radius: 999px; cursor: pointer;
    box-shadow: 0 8px 22px -10px rgba(212, 176, 106, .7), inset 0 1px 0 rgba(255, 255, 255, .5);
    transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
  }
  .btn:hover { filter: brightness(1.05); }
  .btn:active { transform: translateY(1px) scale(.99); }
  .btn.ghost { color: var(--ivory); background: transparent; border: 1px solid var(--line); box-shadow: none; }
  .btn.ghost:hover { border-color: var(--gold); }
  .btn.fb { color: #fff; background: #1877f2; box-shadow: 0 8px 22px -10px rgba(24, 119, 242, .8); }
  .btn.block { display: flex; width: 100%; }
  .event .btn { margin-top: 22px; }

  /* ---------- rsvp ---------- */
  .rsvp-copy { margin: 14px auto 0; max-width: 380px; font-size: 21px; color: var(--ivory-dim); }
  .deadline { margin: 10px 0 0; font-style: italic; font-size: 20px; color: var(--gold); }
  .deadline:empty { display: none; }
  .panel { display: flex; flex-direction: column; gap: 12px; max-width: 360px; margin: 26px auto 0; }
  .field {
    width: 100%; padding: 14px 18px; font: 500 20px var(--serif); color: var(--ivory);
    border: 1px solid var(--line); border-radius: 14px; background: rgba(246, 239, 225, .05);
    transition: border-color .2s ease, background .2s ease;
  }
  .field:focus { outline: none; border-color: var(--gold); background: rgba(246, 239, 225, .08); }
  .field::placeholder { color: var(--muted); }
  textarea.field { resize: vertical; min-height: 90px; line-height: 1.4; }
  .choice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .choice button {
    padding: 14px 8px; font: 600 18px var(--serif); color: var(--ivory); cursor: pointer;
    background: rgba(246, 239, 225, .04); border: 1px solid var(--line); border-radius: 14px;
    transition: all .2s ease;
  }
  .choice button[aria-pressed="true"] { color: var(--bg); background: var(--gold); border-color: var(--gold); }
  .err { min-height: 22px; margin: 0; font-style: italic; font-size: 17px; color: #ef7b8a; text-align: left; }
  .thanks { margin: 0; font-size: 23px; line-height: 1.45; }
  .note { margin: 0; font-style: italic; font-size: 17px; color: var(--muted); }
  .note:empty { display: none; }

  /* ---------- footer ---------- */
  footer { padding: 70px 0 20px; text-align: center; }
  footer .sign { margin: 18px 0 0; font-style: italic; font-size: 22px; color: var(--ivory-dim); }
  footer .mono { margin: 6px 0 0; font-weight: 600; font-size: 38px; line-height: 1.1; }

  /* ---------- envelope ---------- */
  .env {
    --emboss: none; --grain: none;
    position: fixed; inset: 0; z-index: 50; perspective: 1400px; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 40%, #7d1f2d 0%, #4f111b 100%);
    transition: opacity 1s ease, transform 1s ease;
  }
  .env.leave { opacity: 0; transform: scale(1.04); pointer-events: none; }

  .card-in {
    position: absolute; left: 8%; right: 8%; top: 9%; bottom: 14%;
    background: linear-gradient(180deg, #fbf6ea, #f1e7d2); border-radius: 6px;
    box-shadow: 0 6px 24px rgba(20, 4, 8, .45);
    transition: transform 1s var(--ease);
  }
  .env.rise .card-in { transform: translateY(-26%); }
  .ci-frame {
    position: absolute; inset: 12px; border: 1px solid rgba(156, 122, 56, .5); border-radius: 3px;
    display: flex; flex-direction: column; align-items: center; padding-top: 22%; text-align: center; color: #3a2a1f;
  }
  .ci-frame .ulzii { color: #b08a45; margin-bottom: 10px; }
  .ci-kicker { margin: 0; font: italic 400 19px/1.2 var(--serif); color: #7d6a55; }
  .ci-names { margin: 8px 0 0; font: 600 clamp(28px, 8.5vw, 40px)/1.1 var(--serif); color: #6e1a26; }

  .piece { position: absolute; inset: 0; pointer-events: none; }
  .piece i { position: absolute; inset: 0; background-repeat: repeat, no-repeat; background-size: 180px 180px, 100% 100%; }
  .p-left  { filter: drop-shadow(5px 0 8px rgba(20, 2, 6, .45)); }
  .p-right { filter: drop-shadow(-5px 0 8px rgba(20, 2, 6, .45)); }
  .p-bottom { filter: drop-shadow(0 -7px 10px rgba(20, 2, 6, .5)); }
  .p-left i   { clip-path: polygon(0 0, 50% 50%, 0 100%);      background-image: var(--emboss), linear-gradient(100deg, #74192a, #8a2434); }
  .p-right i  { clip-path: polygon(100% 0, 50% 50%, 100% 100%); background-image: var(--emboss), linear-gradient(260deg, #74192a, #8a2434); }
  .p-bottom i { clip-path: polygon(0 100%, 50% 44%, 100% 100%); background-image: var(--emboss), linear-gradient(0deg, #7f1e2f, #962a3b); }

  .flapwrap {
    position: absolute; top: 0; left: 0; width: 100%; height: 52%;
    transform-origin: 50% 0; transform-style: preserve-3d;
    transition: transform 1s cubic-bezier(.55, .05, .25, 1) .12s;
  }
  .env.open .flapwrap { transform: rotateX(-180deg); }
  .flap { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; filter: drop-shadow(0 10px 12px rgba(20, 2, 6, .55)); }
  .flap-shape {
    position: absolute; inset: 0; clip-path: polygon(0 0, 100% 0, 50% 100%);
    background-repeat: repeat, no-repeat; background-size: 180px 180px, 100% 100%;
    background-image: var(--emboss), linear-gradient(180deg, #a3303f, #8a2434);
  }
  .liner {
    position: absolute; inset: 0; transform: rotateX(180deg); backface-visibility: hidden; -webkit-backface-visibility: hidden;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    background: linear-gradient(180deg, #e9d7ac, #d9c08a);
  }

  .seal {
    position: absolute; left: 50%; bottom: 0; width: 112px; height: 112px; padding: 0; border: 0; background: none; cursor: pointer;
    transform: translate3d(-50%, 50%, 2px);
    filter: drop-shadow(0 9px 10px rgba(20, 2, 6, .55));
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    animation: breathe 2.8s ease-in-out infinite;
  }
  .seal svg { display: block; width: 100%; height: 100%; }
  .seal:focus-visible { outline: 3px solid var(--gold-2); outline-offset: 8px; border-radius: 50%; }
  .env.open .seal { animation: press .32s ease-out; }
  @keyframes breathe {
    0%, 100% { transform: translate3d(-50%, 50%, 2px) scale(1); }
    50%      { transform: translate3d(-50%, 50%, 2px) scale(1.06); }
  }
  @keyframes press {
    0%   { transform: translate3d(-50%, 50%, 2px) scale(1); }
    45%  { transform: translate3d(-50%, 50%, 2px) scale(.86); }
    100% { transform: translate3d(-50%, 50%, 2px) scale(1); }
  }

  .env-note {
    position: absolute; left: 50%; top: 78%; width: 80%; text-align: center;
    transform: translate(-50%, -50%); color: #f6e7c4;
    text-shadow: 0 1px 0 rgba(255, 255, 255, .15), 0 -1px 0 rgba(40, 4, 10, .5);
  }
  .env-to { margin: 0 0 8px; font: 600 clamp(28px, 8.4vw, 38px)/1.1 var(--serif); overflow-wrap: anywhere; }
  .env-to:empty { display: none; }
  .env-script { margin: 0; font: italic 500 clamp(20px, 6vw, 26px)/1.3 var(--serif); opacity: .92; }
  .env-hint {
    position: absolute; left: 0; right: 0; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); margin: 0; text-align: center;
    font: italic 400 18px var(--serif); color: rgba(246, 231, 196, .78);
    animation: hint 2.8s ease-in-out infinite;
  }
  @keyframes hint { 50% { opacity: .45; } }
  .grain { position: absolute; inset: 0; pointer-events: none; background-image: var(--grain); opacity: .5; mix-blend-mode: multiply; }

  @media (min-width: 720px) {
    body { font-size: 21px; }
    section { padding-top: 72px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .seal, .env.open .seal, .env-hint, .scroll-cue i { animation: none; }
    .env, .flapwrap, .card-in { transition-duration: .01s; transition-delay: 0s; }
    .reveal { opacity: 1; transform: none; transition: none; }
    .arch-in img { transform: none; transition: none; }
  }
</style>
</head>

<script>

const START = at(c.ceremony.time);
const END = at("23:59");
const WEEKDAY = ["Ням", "Даваа", "Мягмар", "Лхагва", "Пүрэв", "Баасан", "Бямба"][new Date(Date.UTC(Y, M - 1, D)).getUTCDay()] + " гараг";

/* ---------- icons & ornaments ---------- */
// Өлзий хээ — woven endless knot on a 9×9 grid (rotated 45°)
const KNOT = ["###.###..", "#.#.#.#..", "#########", "..#.#.#.#", "#########", "#.#.#.#..", "#########", "..#.#.#.#", "..###.###"];
function knotInner(o = {}) {
  let d = "", lines = "", shade = "";
  KNOT.forEach((row, r) => row.replace(/#+/g, (m, i) => { d += `M${i * 10} ${r * 10}h${m.length * 10}v10.05h-${m.length * 10}z`; return m; }));
  for (const r of [2, 4, 6]) for (const cc of [2, 4, 6]) {
    const x = cc * 10, y = r * 10, hOver = ((r + cc) / 2) % 2 === 0;
    if (hOver) { lines += `M${x} ${y}h10M${x} ${y + 10}h10`; shade += `M${x} ${y - 5}h10v5h-10zM${x} ${y + 10}h10v5h-10z`; }
    else { lines += `M${x} ${y}v10M${x + 10} ${y}v10`; shade += `M${x - 5} ${y}h5v10h-5zM${x + 10} ${y}h5v10h-5z`; }
  }
  const fill = o.grad ? `url(#${o.grad})` : (o.fill || "currentColor");
  return `<g transform="rotate(45 45 45)"><path d="${d}" fill="${fill}"/>` +
    (o.shade ? `<path d="${shade}" fill="#000" opacity=".2"/>` : "") +
    `<path d="${lines}" fill="none" stroke="${o.gap || "#17110e"}" stroke-width="${o.gw || 1.8}"/></g>`;
}
let knotId = 0;
function ulzii(size = 40, o = {}) {
  let defs = "";
  if (o.grad) {
    o = { ...o, grad: "ulg" + (++knotId) };
    defs = `<defs><radialGradient id="${o.grad}" cx=".5" cy=".5" r=".75"><stop offset="0" stop-color="#f6c766"/><stop offset=".55" stop-color="#e2b06a"/><stop offset="1" stop-color="#a98048"/></radialGradient></defs>`;
  }
  return `<svg class="ulzii" width="${size}" height="${Math.round(size * 1.28)}" viewBox="-5 -19 100 128" aria-hidden="true">${defs}${knotInner(o)}</svg>`;
}
// Алхан хээ — key pattern from the reference (12×8 grid tile)
const HEE_GRID = ["############", "...........#", ".#########.#", ".#...#...#.#", "...#.#.#...#", "####.#.#####", ".....#......", "############"];
const HEE = `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="32" viewBox="0 0 48 32"><path fill="#d4b06a" d="` +
  HEE_GRID.map((row, r) => [...row.matchAll(/#+/g)].map((m) => `M${m.index * 4} ${r * 4}h${m[0].length * 4}v4.02h-${m[0].length * 4}z`).join("")).join("") + `"/></svg>`;
const CORNER = `<svg class="corner-svg" viewBox="0 0 54 54" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M4 50C4 24 24 4 50 4"/><path d="M12 50C12 29 29 12 50 12" stroke-opacity=".5"/><circle cx="8" cy="46" r="3" fill="currentColor"/><path d="M20 34c6-1 10 3 10 9-6 1-10-3-10-9zM34 20c-1 6 3 10 9 10 1-6-3-10-9-10z"/></svg>`;
const PIN = '<svg width="14" height="18" viewBox="0 0 14 18" aria-hidden="true"><path d="M7 0C3.1 0 0 3 0 6.8 0 11.7 7 18 7 18s7-6.3 7-11.2C14 3 10.9 0 7 0zm0 9.5a2.7 2.7 0 1 1 0-5.4 2.7 2.7 0 0 1 0 5.4z" fill="currentColor"/></svg>';
const MAP = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>';
const FB = '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M24 12a12 12 0 1 0-13.9 11.9v-8.4H7.1V12h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.4A12 12 0 0 0 24 12z" fill="currentColor"/></svg>';

document.documentElement.style.setProperty("--hee", `url("data:image/svg+xml,${encodeURIComponent(HEE)}")`);
document.querySelectorAll("[data-ulzii]").forEach((el) => { el.outerHTML = ulzii(+el.dataset.ulzii, { gap: "#f4ecdc" }); });

/* ---------- guest & titles ---------- */
const initials = c.bride.charAt(0) + "&" + c.groom.charAt(0);
const GUEST = (new URLSearchParams(location.search).get("to") || "").trim().slice(0, 60);
document.title = `${c.bride} & ${c.groom} — Хуримын урилга`;
$("#envScript").textContent = c.envelopeText;
$("#envTo").textContent = GUEST;
$("#ciNames").textContent = `${c.bride} & ${c.groom}`;

/* ---------- envelope artwork ---------- */
const knotTile = `<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">` +
  [["#e7c27f", 1.2, 0], ["#3a0710", 0, .35]].map(([col, o, op]) =>
    `<g transform="translate(${o} ${o})" opacity="${op || .2}">` +
      `<g transform="translate(45 45) scale(.42) translate(-45 -45)">${knotInner({ fill: col, gap: "#86232f", gw: 3 })}</g>` +
      `<g transform="translate(135 135) scale(.42) translate(-45 -45)">${knotInner({ fill: col, gap: "#86232f", gw: 3 })}</g>` +
      `<circle cx="135" cy="45" r="2" fill="${col}"/><circle cx="45" cy="135" r="2" fill="${col}"/>` +
    `</g>`).join("") + `</svg>`;
const GRAIN = '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .25  0 0 0 0 .05  0 0 0 0 .08  0 0 0 .5 0"/></filter><rect width="200" height="200" filter="url(#n)"/></svg>';
const envEl = $("#env");
envEl.style.setProperty("--emboss", `url("data:image/svg+xml,${encodeURIComponent(knotTile)}")`);
envEl.style.setProperty("--grain", `url("data:image/svg+xml,${encodeURIComponent(GRAIN)}")`);

function blob(cx, cy, R, seed) {
  let d = "";
  for (let i = 0; i < 90; i++) {
    const t = (i / 90) * Math.PI * 2;
    const r = R * (1 + .05 * Math.sin(3 * t + seed) + .035 * Math.sin(5 * t + seed * 1.7) + .02 * Math.sin(9 * t + seed * 2.3));
    d += (i ? "L" : "M") + (cx + r * Math.cos(t)).toFixed(1) + " " + (cy + r * Math.sin(t)).toFixed(1);
  }
  return d + "Z";
}
const mono = (fill, dx, dy, op) => `<text x="60" y="${70 + dy}" dx="${dx}" text-anchor="middle" font-size="30" font-style="italic" font-weight="600" font-family="'Cormorant Garamond', Georgia, serif" fill="${fill}" opacity="${op}">${esc(initials)}</text>`;
$("#seal").innerHTML = `<svg viewBox="0 0 120 120" aria-hidden="true">
  <defs>
    <radialGradient id="wx" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#fff1c8"/><stop offset=".5" stop-color="#e2bd72"/><stop offset="1" stop-color="#a77d35"/></radialGradient>
    <radialGradient id="wx2" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#f6dc9e"/><stop offset="1" stop-color="#c79c50"/></radialGradient>
  </defs>
  <path d="${blob(62, 64, 54, 1.3)}" fill="#8a6326" opacity=".55"/>
  <path d="${blob(60, 60, 54, .2)}" fill="url(#wx)"/>
  <circle cx="60" cy="60" r="38" fill="url(#wx2)" stroke="#9c7a38" stroke-opacity=".7" stroke-width="1.6"/>
  <circle cx="60" cy="60" r="33" fill="none" stroke="#9c7a38" stroke-opacity=".45" stroke-width=".8" stroke-dasharray="1.5 3"/>
  <circle cx="60" cy="60" r="38" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1" transform="translate(-1 -1)"/>
  ${mono("#fff6dc", .8, .9, .85)}${mono("#7a5418", 0, 0, 1)}
  <ellipse cx="42" cy="30" rx="21" ry="9" fill="#fff" opacity=".35" transform="rotate(-25 42 30)"/>
</svg>`;

/* ---------- page ---------- */
function render() {
  const ev = (e, inner) => `
    <div class="event reveal">
      <p class="eyebrow">${esc(e.kicker)}</p>
      <h3 class="venue">${esc(e.venue)}</h3>
      ${inner}
      ${e.address ? `<p class="addr">${PIN}<span>${esc(e.address)}</span></p>` : ""}
      ${e.mapUrl ? `<div><a class="btn ghost" href="${esc(e.mapUrl)}" target="_blank" rel="noopener">${MAP}<span>Газрын зураг</span></a></div>` : ""}
    </div>`;

  $("#page").innerHTML = `
    <section class="hero">
      <div class="reveal hero-knot">${ulzii(104, { grad: true, shade: true })}</div>
      <p class="kicker reveal">Бид гэрлэж байна</p>
      <h1 class="names reveal"><span class="gold-text">${esc(c.bride)}</span><span class="amp gold-text">&amp;</span><span class="gold-text">${esc(c.groom)}</span></h1>
      <div class="reveal">
        <p class="date-line"><span>${esc(WEEKDAY.split(" ")[0])}<br>гараг</span><b class="gold-text">${String(D).padStart(2, "0")}</b><span>${M} сар<br>${Y}</span></p>
        <p class="date-sub">${esc(c.dateText)}</p>
      </div>
      <figure class="arch reveal" style="margin-bottom:0">
        <div class="arch-in"><img src="${esc(c.photo)}" alt="${esc(c.bride)} ба ${esc(c.groom)}" decoding="async" onerror="this.style.display='none'"></div>
        <span class="corner l">${CORNER}</span><span class="corner r">${CORNER}</span>
      </figure>
      <div class="scroll-cue reveal"><span>Доош гүйлгэнэ үү</span><i></i></div>
    </section>

    <div class="hee" style="margin-top:40px"></div>

    <section class="letter">
      <p class="dear reveal">${GUEST ? `Эрхэм хүндэт ${esc(GUEST)}` : ""}</p>
      <p class="reveal">${esc(c.letter)}</p>
      <div class="divider reveal">${ulzii(24, { gw: 2.4 })}</div>
    </section>

    <section style="padding-top:8px">
      <p class="eyebrow reveal">Баярын өдөр хүртэл</p>
      <div class="count reveal" id="count" aria-live="off">
        <div><b data-k="d">0</b><small>Өдөр</small></div>
        <div><b data-k="h">0</b><small>Цаг</small></div>
        <div><b data-k="m">0</b><small>Минут</small></div>
        <div><b data-k="s">0</b><small>Секунд</small></div>
      </div>
      <p class="count-done" id="countDone" hidden></p>
    </section>

    <section>
      <p class="eyebrow reveal">Хөтөлбөр</p>
      <h2 class="title reveal">Баярын өдөр</h2>
      ${ev(c.ceremony, `<p class="time gold-text">${esc(c.ceremony.time)}</p><p class="tlabel">${esc(c.ceremony.timeLabel)}</p>`)}
    </section>

    <div class="hee" style="margin-top:56px"></div>

    <section id="rsvp">
      <p class="eyebrow reveal">Хариу</p>
      <h2 class="title reveal">${esc(c.rsvp.title)}</h2>
      <p class="rsvp-copy reveal">${esc(c.rsvp.copy)}</p>
      <p class="deadline reveal">${esc(c.rsvp.deadline)}</p>
      <div class="panel reveal" id="panel"></div>
    </section>

    <footer>
      <div class="reveal">${ulzii(46, { grad: true, shade: true })}</div>
      <p class="sign reveal">Хүндэтгэсэн,</p>
      <p class="mono reveal gold-text">${esc(c.bride)}<br><span style="font-style:italic;font-weight:400;font-size:.7em">&amp;</span><br>${esc(c.groom)}</p>
    </footer>`;

  renderForm();
}

/* ---------- countdown ---------- */
function tick() {
  const box = $("#count"); if (!box) return;
  let diff = START - Date.now();
  if (diff <= 0) {
    box.hidden = true;
    const done = $("#countDone"); done.hidden = false;
    done.textContent = Date.now() < END ? "Өнөөдөр бидний баярын өдөр!" : "Бидэнтэй хамт баярласан танд баярлалаа!";
    return;
  }
  const s = Math.floor(diff / 1000);
  const v = { d: Math.floor(s / 86400), h: Math.floor(s / 3600) % 24, m: Math.floor(s / 60) % 60, s: s % 60 };
  box.querySelectorAll("b").forEach((b) => { const t = String(v[b.dataset.k]).padStart(b.dataset.k === "d" ? 1 : 2, "0"); if (b.textContent !== t) b.textContent = t; });
  setTimeout(tick, 1000 - (Date.now() % 1000));
}

/* ---------- RSVP ---------- */
const KEY = "rsvp:" + c.date;
const loadSaved = () => { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { return null; } };
const save = (v) => { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} };

function renderForm(prefill = {}) {
  const p = $("#panel");
  let yes = prefill.yes;
  p.innerHTML = `
    <input class="field" id="rName" type="text" autocomplete="name" maxlength="100" placeholder="Таны нэр" aria-label="Таны нэр">
    <div class="choice" role="group" aria-label="Ирэх эсэх">
      <button type="button" data-v="1">Очно</button>
      <button type="button" data-v="0">Очих боломжгүй</button>
    </div>
    <textarea class="field" id="rNote" maxlength="300" placeholder="Мэндчилгээ, ерөөл (заавал биш)" aria-label="Мэндчилгээ"></textarea>
    <p class="err" id="rErr" role="alert"></p>
    <button class="btn block" id="rSend" type="button">Хариу илгээх</button>`;
  $("#rName").value = prefill.name || GUEST || "";
  $("#rNote").value = prefill.note || "";
  const btns = p.querySelectorAll(".choice button");
  const sync = () => btns.forEach((b) => b.setAttribute("aria-pressed", String(yes === (b.dataset.v === "1"))));
  btns.forEach((b) => b.addEventListener("click", () => { yes = b.dataset.v === "1"; sync(); $("#rErr").textContent = ""; }));
  sync();
  $("#rSend").addEventListener("click", () => {
    const name = $("#rName").value.trim();
    if (!name) { $("#rErr").textContent = "Нэрээ бичнэ үү."; $("#rName").focus(); return; }
    if (yes === undefined) { $("#rErr").textContent = "Очих эсэхээ сонгоно уу."; return; }
    const v = { name, yes, note: $("#rNote").value.trim() };
    save(v); renderThanks(v);
  });
}

function renderThanks(v) {
  const p = $("#panel");
  let msg = v.yes
    ? `Сайн байна уу! Би ${v.name}. Хуримд тань очно. Баяр хүргэе!`
    : `Сайн байна уу! Би ${v.name}. Харамсалтай нь хуримд тань очиж чадахгүй нь, уучлаарай. Баяр хүргэе!`;
  if (v.note) msg += " " + v.note;
  p.innerHTML = `
    <p class="thanks"></p>
    <a class="btn fb block" id="rFb" target="_blank" rel="noopener">${FB}<span>Facebook-ээр илгээх</span></a>
    <p class="note" id="rFbNote"></p>
    <button class="btn ghost block" id="rEdit" type="button">Хариултаа өөрчлөх</button>`;
  $(".thanks", p).textContent = v.yes
    ? `Баярлалаа, ${v.name}! Таныг хүлээж байна. Хариугаа доорх товчоор илгээнэ үү.`
    : `Ойлголоо, ${v.name}. Мэдэгдсэнд баярлалаа — хариугаа доорх товчоор илгээнэ үү.`;
  const copy = async () => { try { await navigator.clipboard.writeText(msg); return true; } catch (e) { return false; } };
  $("#rFb").href = c.rsvp.facebook;
  $("#rFb").addEventListener("click", async () => {
    $("#rFbNote").textContent = (await copy())
      ? "Мессеж хуулагдлаа — Facebook дээр Message дараад paste хийгээрэй."
      : "Facebook дээр Message дараад хариугаа бичээрэй.";
  });
  $("#rEdit").addEventListener("click", () => renderForm(v));
}

/* ---------- scroll reveal ---------- */
function setupReveal() {
  const els = document.querySelectorAll(".reveal");
  if (!("IntersectionObserver" in window)) { els.forEach((e) => e.classList.add("in")); return; }
  const io = new IntersectionObserver((entries) => entries.forEach((en) => {
    if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); }
  }), { rootMargin: "0px 0px -8% 0px", threshold: .08 });
  els.forEach((e, i) => { e.style.transitionDelay = (e.closest(".hero") ? i * .12 : 0) + "s"; io.observe(e); });
}

/* ---------- gold dust ---------- */
function dust() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("#dust"), ctx = cv.getContext("2d");
  let W, H, dpr, P = [];
  const resize = () => {
    dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  resize(); addEventListener("resize", resize);
  const N = Math.round(Math.min(46, W / 12));
  for (let i = 0; i < N; i++) P.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.6 + .4, v: Math.random() * .25 + .08, a: Math.random() * Math.PI * 2, s: Math.random() * .02 + .005 });
  const loop = () => {
    ctx.clearRect(0, 0, W, H);
    for (const p of P) {
      p.y -= p.v; p.a += p.s; p.x += Math.sin(p.a) * .25;
      if (p.y < -5) { p.y = H + 5; p.x = Math.random() * W; }
      const tw = .35 + .35 * Math.sin(p.a * 2);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(241, 217, 156, ${tw})`; ctx.fill();
    }
    if (!document.hidden) requestAnimationFrame(loop); else document.addEventListener("visibilitychange", () => requestAnimationFrame(loop), { once: true });
  };
  requestAnimationFrame(loop);
}

/* ---------- boot ---------- */
render();
const saved = loadSaved();
if (saved) renderThanks(saved);
tick();

let opened = false;
function openEnvelope() {
  if (opened) return; opened = true;
  envEl.classList.add("open");
  setTimeout(() => envEl.classList.add("rise"), 800);
  setTimeout(() => {
    envEl.classList.add("leave");
    document.body.classList.remove("locked");
    document.body.classList.add("revealed");
    window.scrollTo(0, 0);
    setupReveal(); dust();
  }, 1750);
  setTimeout(() => { envEl.remove(); $("#page").focus({ preventScroll: true }); }, 2800);
}
envEl.addEventListener("click", openEnvelope);
document.addEventListener("keydown", (e) => { if (!opened && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openEnvelope(); } });
})();
</script>
